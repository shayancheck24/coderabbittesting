services:
  backend:
    build: ./backend
    volumes:
      - catalog:/app/var/data
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://localhost:8000/api/health') === false ? 1 : 0);",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  catalog:
